<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link 
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    >

    <link href="/src/output.css" rel="stylesheet">

    <title>Reen Bank | Register</title>
</head>

<body class="min-h-screen bg-[url('./asset/images/register.png')] bg-cover bg-center">

    <section class="min-h-screen">
        
        <div class="container mx-auto px-5 py-8 sm:px-8 sm:py-12 lg:px-12 xl:px-20 2xl:px-30">

            <div class="flex flex-col gap-12 lg:flex-row lg:items-center lg:justify-between lg:gap-16">

                <!-- LEFT SIDE -->
                <div class="w-full lg:w-1/2">

                    <!-- Logo -->
                    <div>
                        <img 
                            src="./asset/images/logo.png" 
                            alt="Reen Bank Logo"
                            class="w-32 sm:w-36"
                        >
                    </div>

                    <!-- Text -->
                    <div class="mt-12 sm:mt-16 lg:mt-20">

                        <span class="text-lg font-semibold text-[#2CC48A] sm:text-xl">
                            Reen Bank
                        </span>

                        <h1 class="mt-2 text-4xl font-semibold leading-tight text-gray-900 sm:text-5xl lg:text-6xl xl:text-7xl">
                            Experience
                            <br>
                            hassle-free banking
                        </h1>

                        <p class="mt-6 max-w-xl text-base leading-7 text-gray-600 sm:mt-8 sm:text-lg sm:leading-8">
                            Experience simple, secure, and stress-free banking.
                            Say goodbye to long queues and complex procedures
                            and hello to hassle-free banking with Reen Bank.
                        </p>

                    </div>

                    <!-- Social Icons -->
                    <div class="mt-10 flex gap-5 sm:mt-16">

                        <a href="#" class="text-xl text-[#33B786] transition hover:scale-110 sm:text-2xl">
                            <i class="fa-brands fa-facebook"></i>
                        </a>

                        <a href="#" class="text-xl text-[#33B786] transition hover:scale-110 sm:text-2xl">
                            <i class="fa-brands fa-square-instagram"></i>
                        </a>

                        <a href="#" class="text-xl text-[#33B786] transition hover:scale-110 sm:text-2xl">
                            <i class="fa-brands fa-twitter"></i>
                        </a>

                    </div>

                </div>


                <!-- RIGHT SIDE / FORM -->
                <div class="w-full lg:w-1/2">

                    <div class="mx-auto w-full max-w-md rounded-2xl bg-white p-5 shadow-lg sm:p-7 md:p-8">

                        <form class="space-y-5">

                            <!-- Name -->
                            <div>
                                <label
                                    for="name"
                                    class="mb-2 block font-medium text-gray-700"
                                >
                                    Name
                                </label>

                                <div class="relative">

                                    <input
                                        id="name"
                                        type="text"
                                        placeholder="Enter name here"
                                        class="w-full rounded-xl border border-gray-300 px-4 py-3 pr-12 outline-none transition focus:border-[#33B786] focus:ring-1 focus:ring-[#33B786]"
                                    >

                                    <i class="fa-regular fa-user absolute right-4 top-1/2 -translate-y-1/2 text-gray-400"></i>

                                </div>
                            </div>


                            <!-- Email -->
                            <div>
                                <label
                                    for="email"
                                    class="mb-2 block font-medium text-gray-700"
                                >
                                    Email
                                </label>

                                <div class="relative">

                                    <input
                                        id="email"
                                        type="email"
                                        placeholder="Enter your Email"
                                        class="w-full rounded-xl border border-gray-300 px-4 py-3 pr-12 outline-none transition focus:border-[#33B786] focus:ring-1 focus:ring-[#33B786]"
                                    >

                                    <i class="fa-regular fa-envelope absolute right-4 top-1/2 -translate-y-1/2 text-gray-400"></i>

                                </div>
                            </div>


                            <!-- Password -->
                            <div>
                                <label
                                    for="password"
                                    class="mb-2 block font-medium text-gray-700"
                                >
                                    Password
                                </label>

                                <div class="relative">

                                    <input
                                        id="password"
                                        type="password"
                                        placeholder="Enter your Password"
                                        class="w-full rounded-xl border border-gray-300 px-4 py-3 pr-12 outline-none transition focus:border-[#33B786] focus:ring-1 focus:ring-[#33B786]"
                                    >

                                    <i class="fa-solid fa-lock absolute right-4 top-1/2 -translate-y-1/2 text-gray-400"></i>

                                </div>
                            </div>


                            <!-- Terms -->
                            <div class="flex items-start gap-3">

                                <input
                                    type="checkbox"
                                    id="terms"
                                    class="mt-1 h-4 w-4 shrink-0 accent-[#33B786]"
                                >

                                <label
                                    for="terms"
                                    class="text-sm leading-6 text-gray-600"
                                >
                                    I agree to all the
                                    <span class="text-[#33B786]">
                                        Terms, Privacy Policy
                                    </span>
                                    and
                                    <span class="text-[#33B786]">
                                        Fees.
                                    </span>
                                </label>

                            </div>


                            <!-- Register Button -->
                            <button
                                type="submit"
                                class="w-full rounded-xl bg-[#33B786] py-3 text-base font-semibold text-white transition hover:bg-[#2ca776] sm:text-lg"
                            >
                                Register
                            </button>


                            <!-- Login -->
                            <p class="text-sm text-gray-600 sm:text-base">

                                Already have an Account?

                                <a
                                    href="./login.html"
                                    class="font-medium text-[#33B786] hover:underline"
                                >
                                    Log in
                                </a>

                            </p>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </section>
    <script></script>
</body>
</html>
