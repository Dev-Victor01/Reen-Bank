<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link 
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    >
    <link href="./output.css" rel="stylesheet">
    <link rel="shortcut icon" href="./asset/images/image 32.png" type="image/x-icon">
    <title>Reen Bank | Login</title>
</head>

<body class="min-h-screen bg-[url('./asset/images/register.png')] bg-cover bg-center">

<section class="min-h-screen">

    <div class="container mx-auto px-40 py-40">

        <div class="flex flex-col gap-12 lg:flex-row lg:items-center lg:justify-between lg:gap-16">

            <!-- LEFT SIDE -->
            <div class="w-full lg:w-">

                <!-- Logo -->
                <div>
                    <a href="./index.html">
                        <img
                            src="./asset/images/logo.png"
                            alt="Reen Bank logo"
                            class="w-32"
                        >
                    </a>
                </div>

                <!-- Welcome Text -->
                <div class="mt-12 sm:mt-16 lg:mt-[140px]">

                    <span class="text-lg font-semibold text-[#2CC48A] sm:text-xl">
                        Reen Bank
                    </span>

                    <h1 class="mt-3 text-4xl font-semibold text-gray-900 sm:text-5xl lg:text-7xl">
                        Welcome Back
                    </h1>

                    <p class="mt-4 max-w-xl text-sm leading-7 text-gray-600 sm:text-base">
                        Enter Your Details to login to your Banking Dashboard again!
                    </p>

                </div>

                <!-- Social Icons -->
                <div class="mt-10 flex gap-5 sm:mt-20">

                    <a
                        href="#"
                        class="text-xl text-[#33B786] transition hover:scale-110 sm:text-2xl"
                    >
                        <i class="fa-brands fa-facebook"></i>
                    </a>

                    <a
                        href="#"
                        class="text-xl text-[#33B786] transition hover:scale-110 sm:text-2xl"
                    >
                        <i class="fa-brands fa-square-instagram"></i>
                    </a>

                    <a
                        href="#"
                        class="text-xl text-[#33B786] transition hover:scale-110 sm:text-2xl"
                    >
                        <i class="fa-brands fa-twitter"></i>
                    </a>

                </div>

            </div>


            <!-- RIGHT SIDE / LOGIN FORM -->
            <div class="w-[90rem]">
                <div class="mx-auto w-full max-w-md rounded-2xl bg-white p-6 shadow-lg sm:p-8">

                    <form id="loginForm" class="space-y-5">

                        <!-- Heading -->
                        <div class="mb-8">

                            <h1 class="text-4xl font-semibold text-[#33B786]">
                                Login
                            </h1>

                            <p class="mt-3 text-sm text-gray-500">
                                Welcome back! Please login to your account.
                            </p>

                        </div>


                        <!-- Error Message -->
                        <div
                            id="loginMessage"
                            class="hidden rounded-lg px-4 py-3 text-sm"
                        ></div>


                        <!-- Email -->
                        <div>

                            <label
                                for="email"
                                class="mb-2 block font-medium text-gray-700"
                            >
                                Email
                            </label>

                            <div class="relative">

                                <input
                                    id="email"
                                    name="email"
                                    type="email"
                                    placeholder="Enter your Email"
                                    required
                                    autocomplete="email"
                                    class="w-full rounded-xl border border-gray-300 px-4 py-3 pr-12 text-gray-700 outline-none transition focus:border-[#33B786] focus:ring-1 focus:ring-[#33B786]"
                                >

                                <i
                                    class="fa-regular fa-envelope absolute right-4 top-1/2 -translate-y-1/2 text-gray-400"
                                ></i>

                            </div>

                        </div>


                        <!-- Password -->
                       <div>

                            <label
                                for="password"
                                class="mb-2 block font-medium text-gray-700"
                            >
                                Password
                            </label>

                            <div class="relative">

                                <input
                                    id="password"
                                    name="password"
                                    type="password"
                                    placeholder="Enter your Password"
                                    required
                                    autocomplete="current-password"
                                    class="w-full rounded-xl border border-gray-300 px-4 py-3 pr-32 text-gray-700 outline-none transition focus:border-[#33B786] focus:ring-1 focus:ring-[#33B786]"
                                >

                                <div
                                    class="absolute right-4 top-1/2 flex -translate-y-1/2 items-center gap-3"
                                >

                                    <!-- Forgot Password -->
                                    <a
                                        href="#"
                                        class="text-xs font-medium text-[#33B786] hover:underline sm:text-sm"
                                    >
                                        Forgot?
                                    </a>

                                    <!-- Show / Hide Password -->
                                    <button
                                        type="button"
                                        id="togglePassword"
                                        class="text-gray-400 transition hover:text-[#33B786]"
                                        aria-label="Show password"
                                    >
                                        <i class="fa-solid fa-eye"></i>
                                    </button>

                                </div>

                            </div>

                        </div>


                        <!-- Login Button -->
                        <button
                            id="loginButton"
                            type="submit"
                            class="w-full rounded-xl bg-[#33B786] py-3 text-lg font-semibold text-white transition hover:bg-[#2ca776]"
                        >
                            Login
                        </button>


                        <!-- Register -->
                        <p class="text-sm text-gray-600 sm:text-base">

                            Don’t Have an Account?

                            <a
                                href="./register.html"
                                class="font-semibold text-[#33B786] hover:underline"
                            >
                                Register
                            </a>

                        </p>

                    </form>

                </div>

            </div>

        </div>

    </div>

</section>


<script src="./js/login.js"></script>

</body>
</html>
